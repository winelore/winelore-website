asyncapi: '3.0.0'
info:
  title: WineLore live event notifications
  version: 0.1.0
  description: |
    Public v0 change notifications. The service sends Server-Sent Events over an
    HTTP GET stream. Only event metadata is exposed; internal domain payloads
    are not part of this API. There is no authentication, filtering, replay, or
    delivery guarantee in v0. Clients should refetch their GraphQL view after
    notifications and on reconnect.
defaultContentType: application/json
channels:
  events:
    address: /api/v1/events
    x-sse:
      responseContentType: text/event-stream
      eventNameTemplate: '{aggregateType}.{eventType}'
      idField: id
      keepaliveComment: keepalive
    description: |
      One SSE stream for all published domain events. The SSE id equals payload.id,
      and the SSE event name is <aggregateType>.<eventType>. Comment-only
      keepalives are not messages and are sent every 15 seconds.
    messages:
      awardtype:
        name: AwardTypeNotification
        description: Notifications for AwardType events.
        payload:
          allOf:
            - $ref: '#/components/schemas/EventNotification'
            - type: object
              properties:
                aggregateType:
                  const: awardtype
                eventType:
                  type: string
                  enum:
                    - CreatedEvent
                    - NameChangedEvent
                    - OwnerAddedEvent
                    - OwnerRemovedEvent
                    - StatusChangedEvent
      awardtypeedition:
        name: AwardTypeEditionNotification
        description: Notifications for AwardTypeEdition events.
        payload:
          allOf:
            - $ref: '#/components/schemas/EventNotification'
            - type: object
              properties:
                aggregateType:
                  const: awardtypeedition
                eventType:
                  type: string
                  enum:
                    - AwardsUpdatedEvent
                    - CreatedEvent
                    - StatusChangedEvent
      batch:
        name: BatchNotification
        description: Notifications for Batch events.
        payload:
          allOf:
            - $ref: '#/components/schemas/EventNotification'
            - type: object
              properties:
                aggregateType:
                  const: batch
                eventType:
                  type: string
                  enum:
                    - AttributesChangedEvent
                    - CreatedEvent
                    - LotNumberChangedEvent
                    - VolumeChangedEvent
      beverage:
        name: BeverageNotification
        description: Notifications for Beverage events.
        payload:
          allOf:
            - $ref: '#/components/schemas/EventNotification'
            - type: object
              properties:
                aggregateType:
                  const: beverage
                eventType:
                  type: string
                  enum:
                    - ApprovedEvent
                    - AttributesChangedEvent
                    - CreatedEvent
                    - NameChangedEvent
                    - OriginChangedEvent
                    - ProducerDetailsAddedEvent
                    - ProducerDetailsRemovedEvent
                    - PublishedEvent
                    - SubmittedForReviewEvent
                    - SuspendedEvent
      beverageawardassignment:
        name: BeverageAwardAssignmentNotification
        description: Notifications for BeverageAwardAssignment events.
        payload:
          allOf:
            - $ref: '#/components/schemas/EventNotification'
            - type: object
