operations:
  watchEvents:
    action: send
    channel:
      $ref: '#/channels/events'
    description: |
      Clients connect with GET and receive a live SSE stream. This is a
      server-to-client notification operation, so the service action is send.
    bindings:
      http:
        method: GET
        bindingVersion: '0.3.0'
components:
  schemas:
    EventNotification:
      type: object
      additionalProperties: false
      required:
        - id
        - aggregateType
        - aggregateId
        - eventType
        - publishedAt
      properties:
        id:
          type: string
          format: uuid
          description: Stable outbox event ID, also used as the SSE id.
        aggregateType:
          type: string
          description: Aggregate family wire name.
        aggregateId:
          type: string
          description: ID of the aggregate that changed.
        eventType:
          type: string
          description: Domain event class simple name.
        publishedAt:
          type: string
          format: date-time
          description: Kafka record timestamp, not the domain event creation time.
